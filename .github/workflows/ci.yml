name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, nothing to install)
        run: python -m unittest discover -s tests -v
      - name: Lint the example tasks
        run: python -m runguard lint --strict examples/tasks/*.toml
